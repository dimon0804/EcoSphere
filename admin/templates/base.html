<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Green Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f6fffa; }
        .navbar { background-color: #006400; }
        .navbar-brand, .nav-link, h1 { color: white !important; }
        .btn-green { background-color: #28a745; color: white; }
        .btn-red { background-color: #dc3545; color: white; }
        .btn {
    display: inline-block;
    padding: 8px 12px;
    font-size: 14px;
    font-weight: 500;
    text-align: center;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    text-decoration: none;
    transition: background-color 0.2s ease;
}

.btn-sm {
    padding: 4px 8px;
    font-size: 12px;
}

.btn-del {
    background-color: #e74c3c; /* Красный цвет */
    color: white;
}

.btn-del:hover {
    background-color: #c0392b; /* Темнее при наведении */
}

.btn-del:active {
    background-color: #a93226; /* Ещё темнее при нажатии */
}
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" href="/admin">Green Admin</a>
    <div class="navbar-nav">
      <a class="nav-link" href="/admin/projects">Проекты</a>
      <a class="nav-link" href="/admin/users">Пользователи</a>
      <a class="nav-link" href="/admin/organizations">Организации</a>
    </div>
  </div>
</nav>
<div class="container mt-4">
    {% block content %}{% endblock %}
</div>
</body>
</html>
